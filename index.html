<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Fertilizer Management System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="logo">🌱 Smart Fertilizer Management</div>
  <div class="step-text" id="stepText">Step 1 of 5</div>
</header>

<main>
<section class="page active" id="loginPage">
  <div class="panel login-panel">
    <h1>🌱 Welcome</h1>
    <p>Smart Fertilizer Management System</p>
    <label>Username</label>
    <input id="username" placeholder="Enter username">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password">
    <button onclick="login()">Login</button>
    <small>Demo: enter any username and password.</small>
  </div>
</section>

<section class="page" id="profilePage">
  <div class="panel">
    <h2>👨‍🌾 Farmer Profile</h2>
    <label>Farmer Name</label><input id="farmer_name" placeholder="Enter farmer name">
    <label>Farm Name / Details</label><input id="farm_name" placeholder="Enter farm name or details">
    <label>Email</label><input id="email" type="email" placeholder="Enter email">
    <label>Phone Number</label><input id="phone" placeholder="Enter phone number">
    <button onclick="saveProfile()">Create Profile</button>
  </div>
</section>

<section class="page" id="dataPage">
  <div class="panel">
    <h2>🌾 Farm Data Entry</h2>
    <p class="note">Read the values from the Arduino Uno/LCD and enter them manually here.</p>
    <div class="grid">
      <div><label>Crop</label><select id="crop"><option>Rice</option><option>Wheat</option><option>Maize</option><option>Tomato</option><option>Cotton</option></select></div>
      <div><label>Farm Area</label><input id="farm_area" type="number" min="0" placeholder="Example: 2"></div>
      <div><label>Soil Moisture (%)</label><input id="moisture" type="number" min="0" max="100" placeholder="45"></div>
      <div><label>Nitrogen (N)</label><input id="nitrogen" type="number" min="0" placeholder="25"></div>
      <div><label>Phosphorus (P)</label><input id="phosphorus" type="number" min="0" placeholder="35"></div>
      <div><label>Potassium (K)</label><input id="potassium" type="number" min="0" placeholder="40"></div>
      <div><label>Temperature (°C)</label><input id="temperature" type="number" placeholder="28"></div>
      <div><label>Humidity (%)</label><input id="humidity" type="number" min="0" max="100" placeholder="70"></div>
    </div>
    <button onclick="analyze()">🔍 Analyze Farm Data</button>
  </div>
</section>

<section class="page" id="analysisPage">
  <div class="panel">
    <h2>📊 Analysis</h2>
    <div id="summary"></div>
    <button onclick="showPage('recommendationPage',4)">View Fertilizer Recommendation →</button>
  </div>
</section>

<section class="page" id="recommendationPage">
  <div class="panel">
    <h2>💡 Fertilizer Recommendation</h2>
    <div class="recommendation" id="recommendation"></div>
    <button onclick="downloadReport()">⬇ Download Report / Receipt</button>
  </div>
</section>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
